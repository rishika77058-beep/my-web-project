<html>
<head>
<title>contact us</title>
<style>
.contact-form{
	width:600px;
	margin:auto;
	padding:0px 10px;
	overflow:hidden;}
.contact-form-text{display:block;
	width:100%;
	box-sizing:border-box;
	margin:16px 0px;
	border:0;
	background:pink;
	padding:20px 40px;
	outline:none;
	color :rgb(255,255,255)
	transition:0.5s;
	 }
	</style>
</head>
<body background="\clipkart\Images\sunsett.jpeg">
<form class="contact-form" action="index html" method="post">
<h1><p align="center" class="contact-form-text">Contact Us</p></h1>
<input type="text" class="contact-form-text" placeholder="Your name..."><br>
<input type="number" class="contact-form-text" placeholder="Your number...." maxlength=10><br>
<input type="text" class="contact-form-text" placeholder="Your problem"......"><br>
<pre>                                    <input type ="button" value="send"></pre>
</form>
</body>
</html>
