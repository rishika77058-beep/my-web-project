<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Men Store</title>

<style>
body {
    font-family: Arial;
   background:black; }
	
	
h3{
	color:maroon;
	}

.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

.card {
    background:tan;
    width: 220px;
    margin: 15px;
    padding: 10px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

.price {
    color: black;
    font-weight: bold;
}

button {
    margin: 5px;
    padding: 8px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
h1{
	font-family:culz;color:grey;}

.add {
    background: #d2a679;
    color: white;
}

.buy {
    background: #808080;
    color: black;
}
@keyframes grow{0%{font-size:5;}
	20%{font-size:10px;}
	40%{font-size:15px;}
	60%{font-size:30px;}
	80%{font-size:40px;}
	100%{font-size:40px;;} }
@keyframes text{0%{color:blue;}
	20%{color:red;}
	40%{color:black;}
	60%{color:teal;}
	80%{color:orange;}
	100%{color:maroon;} }
.blink{
font-size:20px;
animation: grow 2s forwards, text 1s infinite;}

</style>
</head>

<body>
<h1 align="center">CLIPKART FASHION STORE</H1>

<h2 class="blink" style="text-align:center;font-family:chiller">Men Section</h2>

<div class="container">

    <div class="card">
        <img src="\clipkart\Images\images (5).jpg">
        <h3>Shirt</h3>
        <p class="price">4999 Rs.</p>
        <button class="add" onclick="addToCart('Shirt')">Add to Cart</button>
        <button class="buy" onclick="buyNow('Shirt')">Buy Now</button>
    </div>

    <div class="card">
        <img src="\clipkart\Images\images (6).jpg">
        <h3>Pant</h3>
        <p class="price">2999 Rs.</p>
        <button class="add" onclick="addToCart('Pant')">Add to Cart</button>
        <button class="buy" onclick="buyNow('Pant')">Buy Now</button>
    </div>

    <div class="card">
        <img src="\clipkart\Images\download (10).jpg">
        <h3>Jeans</h3>
        <p class="price">799 Rs.</p>
        <button class="add" onclick="addToCart('Jeans')">Add to Cart</button>
        <button class="buy" onclick="buyNow('Jeans')">Buy Now</button>
    </div>

    <div class="card">
        <img src="\clipkart\Images\download (11).jpg">
        <h3>Jogger</h3>
        <p class="price">499 Rs.</p>
        <button class="add" onclick="addToCart('Jogger')">Add to Cart</button>
        <button class="buy" onclick="buyNow('Jogger')">Buy Now</button>
    </div>

    <div class="card">
        <img src="\clipkart\Images\download (12).jpg">
        <h3>Sweatshirt</h3>
        <p class="price">999 Rs.</p>
        <button class="add" onclick="addToCart('Sweatshirt')">Add to Cart</button>
        <button class="buy" onclick="buyNow('Sweatshirt')">Buy Now</button>
    </div>

    <div class="card">
        <img src="\clipkart\Images\download (13).jpg">
        <h3>Short</h3>
        <p class="price">299 Rs.</p>
        <button class="add" onclick="addToCart('Short')">Add to Cart</button>
        <button class="buy" onclick="buyNow('Short')">Buy Now</button>
    </div>

    <div class="card">
        <img src="\clipkart\Images\download (14).jpg">
        <h3>Rado Watch</h3>
         <p class="price">80000 Rs.</p>
        <button class="add" onclick="addToCart('Watch')">Add to Cart</button>
        <button class="buy" onclick="buyNow('Watch')">Buy Now</button>
    </div>

    <div class="card">
        <img src="\clipkart\Images\download (15).jpg">
        <h3>VanHeusen Wallet</h3>
        <p class="price">9999 Rs.</p>
        <button class="add" onclick="addToCart('Wallet')">Add to Cart</button>
        <button class="buy" onclick="buyNow('Wallet')">Buy Now</button>
    </div>

    <div class="card">
        <img src="\clipkart\Images\download (16).jpg">
        <h3>Shoes</h3>
        <p class="price">5000 Rs.</p>
        <button class="add" onclick="addToCart('Shoes')">Add to Cart</button>
        <button class="buy" onclick="buyNow('Shoes')">Buy Now</button>
    </div>


</div>

<script>
function addToCart(item) {
    alert(item + " added to cart !!");
}

function buyNow(item) {
    alert("Redirecting to payment for " + item + " !!");
    
}
</script>

</body>
</html>
